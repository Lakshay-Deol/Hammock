services:
  - type: web
    name: hammock-maintainer-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/cli.js dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: HAMMOCK_REPLAY
        value: "1"
      - key: HAMMOCK_DRY_RUN
        value: "1"
      - key: HAMMOCK_SANDBOX_REPO
        value: "Lakshay-Deol/hammock-sandbox"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
